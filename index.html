<script>
    const formSection = document.getElementById('form-section');

    function revealForm() {
      if (formSection) {
        formSection.style.display = 'block';
        localStorage.setItem('canada_vsl_unlocked', 'true');
        setTimeout(() => {
          formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    }

    // 1. Reveal immediately if previously unlocked
    if (localStorage.getItem('canada_vsl_unlocked') === 'true') {
      revealForm();
    }

    // 2. Reveal when Vidalytics CTA button is clicked (hash navigation)
    window.addEventListener('hashchange', () => {
      if (window.location.hash === '#form-section') {
        revealForm();
      }
    });

    // 3. Fallback: catch clicks from inside or around the video wrapper
    document.addEventListener('click', (e) => {
      const target = e.target.closest('a');
      if (target && target.getAttribute('href') && target.getAttribute('href').includes('form-section')) {
        e.preventDefault();
        revealForm();
      }
    });

    // 4. Maximum failsafe timer (10m30s clock time)
    setTimeout(revealForm, 630 * 1000);

    const form = document.getElementById('form');
    const thankYou = document.getElementById('thankYou');
    const redirectText = document.getElementById('redirectText');
    const errorBox = document.getElementById('errorBox');

    const scriptURL = "https://script.google.com/macros/s/AKfycbyd72sz69-OkpJfB3fdKua_tvw38LvbvM5-bnK2TMzfDSV8YHXhff_jxrf6TN7RRIyF/exec";

    function calculateClientScore() {
      let score = 0;

      const formule = document.getElementById("formule_choisie").value;
      if (formule.includes("bureau")) score += 25;
      else if (formule.includes("livraison")) score += 20;
      else if (formule.includes("informations")) score -= 10;

      const budget = document.getElementById("budget").value;
      if (budget.includes("2.000.000")) score += 30;
      else if (budget.includes("1.000.000")) score += 20;
      else if (budget.includes("500.000")) score += 10;
      else score += 5;

      const fr = document.getElementById("francais").value;
      if (fr === "Excellent") score += 15;
      else if (fr === "Intermédiaire") score += 8;
      else score += 2;

      const en = document.getElementById("anglais").value;
      if (en === "Avancé / Courant") score += 15;
      else if (en === "Intermédiaire / Base professionnelle") score += 8;
      else score += 2;

      const exp = document.getElementById("experience").value;
      if (exp.includes("3 ans ou plus")) score += 15;
      else if (exp.includes("1 à 2 ans")) score += 10;
      else score += 3;

      const niveau = document.getElementById("niveau").value;
      if (niveau.includes("Doctorat / Master")) score += 12;
      else if (niveau.includes("Licence / TS")) score += 8;
      else if (niveau.includes("Baccalauréat")) score += 5;
      else score += 2;

      const ageVal = parseInt(document.getElementById("age").value, 10) || 0;
      if (ageVal >= 22 && ageVal <= 35) score += 12;
      else if (ageVal >= 36 && ageVal <= 45) score += 7;
      else if (ageVal > 0 && ageVal < 22) score += 5;
      else if (ageVal > 45) score += 2;

      const objectif = document.getElementById("objectif").value;
      if (objectif.includes("Je ne sais pas encore")) score -= 2;

      return score;
    }

    (function fillTracking() {
      const qs = new URLSearchParams(window.location.search);

      const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
      };

      setVal("landing_url", window.location.href);
      setVal("referrer", document.referrer || "");

      let source = "direct";
      if (document.referrer) source = "referral";
      if (qs.get("fbclid")) source = "facebook";

      const us = (qs.get("utm_source") || "").toLowerCase();
      if (us.includes("google")) source = "google";
      if (us.includes("tiktok")) source = "tiktok";
      if (us.includes("instagram")) source = "instagram";

      setVal("traffic_source", source);
      setVal("utm_source", qs.get("utm_source"));
      setVal("utm_medium", qs.get("utm_medium"));
      setVal("utm_campaign", qs.get("utm_campaign"));
      setVal("utm_content", qs.get("utm_content"));
      setVal("utm_term", qs.get("utm_term"));
      setVal("utm_id", qs.get("utm_id"));
      setVal("fbclid", qs.get("fbclid"));
    })();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const clientScore = calculateClientScore();
      const isEligible = clientScore >= 65;

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Envoi en cours…";

      const payload = {};
      new FormData(form).forEach((value, key) => { 
        payload[key] = typeof value === 'string' ? value.trim() : value; 
      });
      payload["pays"] = "Canada Only";

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(payload),
        mode: "no-cors"
      })
      .then(() => {
        formSection.style.display = "none";
        thankYou.style.display = "block";

        if (!isEligible) {
          redirectText.textContent = "Nous reviendrons vers vous si une opportunité correspondant à votre profil se présente.";
          return;
        }

        if (typeof fbq === 'function') fbq('track', 'Lead');

        setTimeout(() => {
          const msg =
`✅ Nouvelle demande — ENTRÉE EXPRESS CANADA

👤 Identité
- Nom: ${payload.nom}
- WhatsApp: ${payload.whatsapp}
- Âge: ${payload.age} ans

🎓 Profil Académique
- Niveau d'études: ${payload.niveau}
- Domaine/Métier: ${payload.domaine}
- Expérience: ${payload.experience}

🇨🇦 Projet Canada
- Option visée: ${payload.objectif}

🗣️ Niveau Langues
- Français: ${payload.niveau_francais}
- Anglais: ${payload.niveau_anglais}

💰 Budget & Modalité
- Budget disponible: ${payload.budget}
- Option choisie: ${payload.formule_choisie}

📌 Tracking Source
- Source: ${payload.traffic_source} | UTM: ${payload.utm_source} / ${payload.utm_medium} / ${payload.utm_campaign}`;

          window.location.href = "https://wa.me/213540686563?text=" + encodeURIComponent(msg);
        }, 2200);
      })
      .catch((err) => {
        btn.disabled = false;
        btn.textContent = "Postuler pour l'évaluation Canada";
        errorBox.textContent = "Une erreur est survenue lors de l'envoi. Veuillez réessayer.";
        errorBox.style.display = "block";
      });
    });
  </script>
